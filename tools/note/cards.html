<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:"Noto Sans CJK SC",sans-serif}
.card{position:relative;width:1080px;height:1440px;overflow:hidden;color:#fff4e0;margin-bottom:20px;
  background:radial-gradient(ellipse at 50% 30%,#5a1a0c 0%,#2a0904 55%,#140402 100%)}
.snow{position:absolute;inset:0;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:5}
.serif{font-family:"Noto Serif CJK SC",serif;font-weight:700}
.h1{position:absolute;left:0;right:0;text-align:center;z-index:6;text-shadow:0 4px 18px rgba(0,0,0,.6)}
.y{color:#ffcf5c}
.pill{display:inline-block;padding:16px 40px;border-radius:60px;background:#ff2442;color:#fff;font-weight:900;font-size:46px;box-shadow:0 10px 30px rgba(255,36,66,.45)}
.sub{font-size:34px;color:#ffdcb5;font-weight:500;letter-spacing:2px}
.tag{display:inline-block;padding:8px 22px;border-radius:30px;background:rgba(255,207,92,.16);border:2px solid rgba(255,207,92,.6);color:#ffd98a;font-size:30px;font-weight:700;margin:0 8px}
/* 1 封面 */
#c1{background:#1b0703}
#c1 .table{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.62) saturate(1.1)}
#c1 .vign{position:absolute;inset:0;width:100%;height:100%;background:linear-gradient(180deg,rgba(20,4,2,.92) 0%,rgba(20,4,2,.55) 30%,rgba(20,4,2,0) 48%,rgba(20,4,2,0) 85%,rgba(20,4,2,.7) 100%)}
#potbox{position:absolute;left:80px;top:500px;width:920px;height:920px}
#potbox img{position:absolute}
.steam{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.32),rgba(255,255,255,0) 70%);filter:blur(6px);z-index:3}
/* 2 四宫格 */
.grid{position:absolute;left:54px;right:54px;top:300px;display:grid;grid-template-columns:1fr 1fr;grid-gap:30px}
.shot{position:relative;height:500px;border-radius:28px;overflow:hidden;border:4px solid rgba(255,207,92,.55);box-shadow:0 12px 30px rgba(0,0,0,.5)}
.shot img{position:absolute;width:200%;left:-50%}
.shot b{position:absolute;left:0;right:0;bottom:0;padding:44px 10px 18px;text-align:center;font-size:36px;font-weight:900;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(20,4,2,.92));letter-spacing:1px}
.shot b.top{top:0;bottom:auto;padding:18px 10px 44px;background:linear-gradient(0deg,rgba(0,0,0,0),rgba(20,4,2,.92))}
.shot b small{display:block;font-size:24px;font-weight:500;color:#ffd9b0;margin-top:4px}
/* 3 结算卡 */
.res{position:absolute;left:165px;top:330px;width:750px;height:985px;border-radius:30px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 0 5px rgba(255,207,92,.5);transform:rotate(-2deg)}
.res img{position:absolute;width:1080px;left:-165px;top:-36px}
.sticker{position:absolute;z-index:7;padding:14px 26px;border-radius:18px;background:#ffcf5c;color:#3a0d05;font-size:34px;font-weight:900;box-shadow:0 8px 20px rgba(0,0,0,.45)}
/* 4 结尾 */
.phone{position:absolute;left:300px;top:330px;width:480px;height:853px;border-radius:52px;overflow:hidden;border:12px solid #120403;box-shadow:0 0 0 3px #6b3a22,0 30px 70px rgba(0,0,0,.7);transform:rotate(4deg)}
.phone img{width:100%;display:block}
.bubble{position:absolute;z-index:7;background:#fff4e0;color:#3a0d05;font-weight:900;font-size:32px;padding:16px 24px;border-radius:24px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
</style></head><body>

<div class="card" id="c1">
  <img class="table" src="../../img/scene/table.webp">
  <div class="vign"></div>
  <div id="potbox"><img src="../../img/scene/pot.webp" style="left:0;top:0;width:920px"></div>
  <div class="h1 serif" style="top:96px;font-size:118px;line-height:1.22">冬天了<br><span class="y">请你吃火锅呀</span></div>
  <div class="h1 sub" style="top:418px">毛肚给你涮好了，七上八下一下没少</div>
  <canvas class="snow" width="1080" height="1440"></canvas>
</div>

<div class="card" id="c2">
  <div class="h1 serif" style="top:84px;font-size:86px">但这顿火锅<span class="y">不太好吃</span></div>
  <div class="h1 sub" style="top:206px">同桌个个都是狠人</div>
  <div class="grid">
    <div class="shot"><img src="vf_06.90.jpg" style="top:-330px"><b>毛肚要七上八下<small>少涮一下都不算正宗</small></b></div>
    <div class="shot"><img src="vf_13.90.jpg" style="top:-430px;left:-2%"><b>闺蜜伸筷子抢肉<small>点她筷子才挡得住</small></b></div>
    <div class="shot"><img src="vf_17.30.jpg" style="top:-760px"><b class="top">领导举杯了<small>3 秒内不干杯就扣分</small></b></div>
    <div class="shot"><img src="vf_25.60.jpg" style="top:-430px"><b>见手青没煮熟<small>……看见小人了</small></b></div>
  </div>
  <canvas class="snow" width="1080" height="1440"></canvas>
</div>

<div class="card" id="c3">
  <div class="h1 serif" style="top:84px;font-size:86px">吃完测你是<span class="y">哪种火锅人</span></div>
  <div class="h1 sub" style="top:206px">我第一把就翻车了</div>
  <div class="res"><img src="vf_29.40.jpg"></div>
  <div class="sticker" style="right:40px;top:400px;transform:rotate(8deg)">云南朋友建议<br>我先去医院</div>
  <div class="sticker" style="left:40px;bottom:80px;transform:rotate(-6deg);background:#fff4e0">评论区晒晒你的</div>
  <canvas class="snow" width="1080" height="1440"></canvas>
</div>

<div class="card" id="c4">
  <div class="h1 serif" style="top:84px;font-size:96px">天冷了，<span class="y">这顿我请</span></div>
  <div class="h1" style="top:224px"><span class="tag">不用出门</span><span class="tag">不用排队</span><span class="tag">不用AA</span></div>
  <div class="phone"><img src="vf_21.00.jpg"></div>
  <div class="bubble" style="left:60px;top:560px;transform:rotate(-5deg)">今日火锅<br><small style="font-size:24px;font-weight:600">全网吃同一锅<br>比比谁分高</small></div>
  <div class="bubble" style="right:52px;top:870px;transform:rotate(5deg)">肉我涮<br>领导你敬</div>
  <div class="h1" style="top:1250px"><span class="pill">小红书搜「火锅局」</span></div>
  <div class="h1 sub" style="top:1364px;font-size:28px">小工具 · 点开就能吃</div>
  <canvas class="snow" width="1080" height="1440"></canvas>
</div>

<script src="cards.js"></script>
</body></html>
