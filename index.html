<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>火锅局</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <header id="hud" class="hud">
    <div class="pill scene"><b id="hud-scene">兄弟局</b><small id="hud-sub">九宫格 · 川渝</small></div>
    <div id="timer" class="timer">
      <svg viewBox="0 0 40 40"><circle class="track" cx="20" cy="20" r="18"/><circle id="ring" class="ring" cx="20" cy="20" r="18"/></svg>
      <span id="time">1:30</span>
    </div>
    <div class="pill score"><span id="score">0</span><small>分</small></div>
  </header>
  <div id="combo" class="combo"></div>
  <div id="tools" class="tools">
    <button id="btn-hint" class="tool" type="button">火候提示</button>
    <span id="pro" class="pro">老手 ×1.2</span>
    <button id="btn-sound" class="tool" type="button">声音</button>
  </div>

  <footer id="tray" class="tray">
    <div class="tray-tip"><em class="tag drop">煮</em>拖进锅，熟了点它捞起　<em class="tag swish">涮</em>按住上下涮，松手捞起</div>
    <div id="plates" class="plates"></div>
  </footer>

  <div id="event" class="event">
    <b id="event-text"></b><small id="event-sub"></small>
    <button id="btn-toast" class="toast-btn" type="button">干杯</button>
  </div>

  <div id="coach" class="coach hidden">
    <small id="coach-title"></small>
    <p id="coach-text"></p>
    <button id="coach-btn" class="cta small hidden" type="button">开吃</button>
    <button id="coach-skip" class="skip" type="button">跳过教学</button>
  </div>

  <div id="msg" class="msg"></div>

  <section id="loading" class="overlay">
    <div class="card">
      <h1>火锅局</h1>
      <p id="loadtext" class="sub">正在烧锅底…</p>
      <div class="bar"><i id="loadbar"></i></div>
    </div>
  </section>

  <section id="home" class="overlay hidden">
    <div class="home">
      <div class="home-top">
        <span id="h-title" class="chip title-chip">火锅学徒</span>
        <span id="h-streak" class="chip"></span>
        <span class="chip coin-chip"><i class="coin"></i><b id="h-coins">0</b></span>
      </div>
      <h1 class="logo">火锅局</h1>
      <p class="sub">涮得好是技术，吃得好是情商</p>

      <div id="daily" class="daily">
        <div class="daily-head"><b>今日火锅</b><small id="d-date"></small><em id="d-bonus" class="bonus">今日首局金币 ×2</em></div>
        <div id="d-menu" class="d-menu"></div>
        <div class="daily-foot"><small id="d-best">所有人今天吃同一锅，比比谁分高</small><button id="btn-daily" class="cta small" type="button">吃今日这锅</button></div>
      </div>

      <div id="scenes" class="scenes"></div>

      <div class="home-nav">
        <button id="btn-shop" class="ghost" type="button">菜单 · 解锁</button>
        <button id="btn-codex" class="ghost" type="button">图鉴 · 成就</button>
      </div>
      <button id="btn-tutorial" class="link" type="button">新手教学</button>
    </div>
  </section>

  <section id="shop" class="overlay panel hidden">
    <div class="sheet">
      <div class="sheet-head"><b>菜单 · 解锁</b><span class="chip coin-chip"><i class="coin"></i><b id="s-coins">0</b></span></div>
      <p class="sheet-sub">点菜品选择带不带上桌（<b id="s-count">0</b> / 8）。每局得分会换成金币，攒够了解锁新菜。</p>
      <div id="s-list" class="s-list"></div>
      <button class="ghost close" data-close="shop" type="button">返回</button>
    </div>
  </section>

  <section id="codex" class="overlay panel hidden">
    <div class="sheet">
      <div class="sheet-head"><b>图鉴 · 成就</b><span id="c-title" class="chip title-chip"></span></div>
      <p id="c-next" class="sheet-sub"></p>
      <div class="tabs"><button class="tab on" data-tab="dex" type="button">菜品图鉴</button><button class="tab" data-tab="ach" type="button">成就</button></div>
      <div id="c-dex" class="c-list"></div>
      <div id="c-ach" class="c-list hidden"></div>
      <button class="ghost close" data-close="codex" type="button">返回</button>
    </div>
  </section>

  <section id="result" class="overlay hidden">
    <div class="result-wrap">
      <img id="r-img" class="r-img" alt="饭局报告">
      <p id="save-tip" class="save-tip"></p>
      <div id="rewards" class="rewards"></div>
      <div class="r-actions">
        <button id="btn-save" class="cta" type="button">保存饭局报告</button>
        <div class="r-row">
          <button id="btn-share" class="ghost hidden" type="button">分享给好友</button>
          <button id="btn-again" class="ghost" type="button">再来一局</button>
          <button id="btn-home" class="ghost" type="button">回首页</button>
        </div>
      </div>
    </div>
  </section>
</div>
<script src="js/config.js"></script>
<script src="js/platform.js"></script>
<script src="js/fx.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/meta.js"></script>
<script src="js/card.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/main.js"></script>
</body>
</html>
